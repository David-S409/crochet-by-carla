<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Warm cream background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdf6ee"/>
      <stop offset="100%" stop-color="#f5e8d8"/>
    </linearGradient>

    <!-- Subtle yarn-ball decoration circle -->
    <radialGradient id="circle1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c4b0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f2c4b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="circle2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8b9a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a8b9a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative blobs -->
  <ellipse cx="100" cy="100" rx="220" ry="220" fill="url(#circle1)"/>
  <ellipse cx="1120" cy="540" rx="260" ry="260" fill="url(#circle2)"/>
  <ellipse cx="1050" cy="80" rx="140" ry="140" fill="#f2c4b0" opacity="0.2"/>
  <ellipse cx="160" cy="560" rx="120" ry="120" fill="#a8b9a0" opacity="0.2"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="8" fill="#8b5e3c"/>

  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" fill="#8b5e3c"/>

  <!-- Yarn ball icon (decorative) -->
  <g transform="translate(580, 148)" opacity="0.18">
    <circle cx="20" cy="20" r="52" fill="none" stroke="#8b5e3c" stroke-width="3"/>
    <ellipse cx="20" cy="20" rx="52" ry="20" fill="none" stroke="#8b5e3c" stroke-width="2.5"/>
    <ellipse cx="20" cy="20" rx="25" ry="52" fill="none" stroke="#8b5e3c" stroke-width="2.5"/>
  </g>

  <!-- Hook icon (decorative) -->
  <g transform="translate(60, 260)" opacity="0.12">
    <path d="M0 0 L0 80 Q0 110 30 110 Q60 110 60 80 Q60 60 40 60" fill="none" stroke="#8b5e3c" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- "Handmade with love" label -->
  <text
    x="600"
    y="230"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="22"
    fill="#8b5e3c"
    letter-spacing="6"
  >HANDMADE WITH LOVE</text>

  <!-- Divider line -->
  <line x1="420" y1="248" x2="780" y2="248" stroke="#c9a87c" stroke-width="1.5" opacity="0.7"/>

  <!-- Main name -->
  <text
    x="600"
    y="360"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="72"
    font-weight="bold"
    fill="#4a2f1a"
    letter-spacing="-1"
  >HandCrocheted</text>
  <text
    x="600"
    y="448"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="72"
    font-weight="bold"
    fill="#4a2f1a"
    letter-spacing="-1"
  >ByCarlaArias</text>

  <!-- Divider line -->
  <line x1="420" y1="478" x2="780" y2="478" stroke="#c9a87c" stroke-width="1.5" opacity="0.7"/>

  <!-- Instagram handle -->
  <text
    x="600"
    y="530"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="26"
    fill="#8b5e3c"
    letter-spacing="2"
  >@HandCrochetedByCarlaArias</text>
</svg>
